<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Metafi Content</title>
  <style>
    :root{--bg:#0c1312;--panel:#14201e;--line:#263b37;--text:#f2f6f5;--muted:#9eb1ad;--mint:#30d098;--danger:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}button,a{font:inherit}.shell{width:min(920px,100%);margin:auto;padding:24px 16px 64px}.brand{color:var(--mint);font-weight:800;letter-spacing:.04em}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.back{color:var(--muted);text-decoration:none}.title{font-size:28px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;gap:14px}.campaign,.post{display:block;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;text-decoration:none}.campaign h2,.post h3{margin:0 0 5px;font-size:18px}.meta{color:var(--muted);font-size:13px}.counts{display:flex;gap:18px;margin-top:16px}.count b{display:block;font-size:20px;color:var(--text)}.count span{color:var(--muted);font-size:12px}.section{margin:30px 0 12px;font-size:17px}.post{display:grid;grid-template-columns:96px 1fr;gap:14px}.thumb{width:96px;aspect-ratio:9/16;object-fit:cover;border-radius:12px;background:#09100f}.caption{white-space:pre-wrap;margin:10px 0;color:#dbe5e2}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:11px}.badge.on{border-color:var(--mint);color:var(--mint)}.actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.actions button,.actions a{border:1px solid var(--line);background:#1b2b28;color:var(--text);border-radius:10px;padding:9px 11px;text-decoration:none;cursor:pointer}.actions .primary{background:var(--mint);border-color:var(--mint);color:#07110e;font-weight:700}.empty,.error{padding:30px 10px;text-align:center;color:var(--muted)}.error{color:var(--danger)}dialog{width:min(620px,calc(100% - 24px));border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:14px}dialog::backdrop{background:#000b}.slides{display:flex;gap:10px;overflow:auto;padding:4px}.slides img{width:min(280px,75vw);border-radius:12px}.close{float:right;background:none;border:0;color:var(--text);font-size:22px}@media(min-width:680px){.campaign-grid{grid-template-columns:repeat(2,1fr)}.post{grid-template-columns:120px 1fr}.thumb{width:120px}}
  </style>
</head>
<body><main class="shell"><div class="top"><div class="brand">METAFI</div><a class="back" id="back" href="/team" hidden>← Campaigns</a></div><div id="app"><div class="empty">Loading…</div></div></main>
<dialog id="preview"><button class="close" onclick="preview.close()" aria-label="Close">×</button><h2>Slides</h2><div class="slides" id="slides"></div></dialog>
<script>
const app=document.getElementById('app'), preview=document.getElementById('preview');let currentPosts=new Map();
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const date=s=>new Intl.DateTimeFormat('en',{month:'short',day:'numeric',year:'numeric'}).format(new Date(s+'T12:00:00Z'));
async function json(url,init){const r=await fetch(url,init),b=await r.json();if(!r.ok)throw new Error(b.error||'Request failed');return b}
function campaignCard(c){return `<a class="campaign" href="/team/campaign/${encodeURIComponent(c.campaign_id)}"><h2>${esc(c.name)}</h2><div class="meta">${esc(c.account)} · ${date(c.start_date)} – ${date(c.end_date)}</div><div class="counts"><div class="count"><b>${c.ready_count}</b><span>Ready</span></div><div class="count"><b>${c.saved_count}</b><span>Saved</span></div><div class="count"><b>${c.posted_count}</b><span>Posted</span></div></div></a>`}
async function campaigns(){const d=await json('/api/team/campaigns');app.innerHTML=`<h1 class="title">Campaigns</h1><p class="sub">Ready posts from your active content campaigns.</p>${d.campaigns.length?`<div class="grid campaign-grid">${d.campaigns.map(campaignCard).join('')}</div>`:'<div class="empty">No ready posts yet.</div>'}`}
function group(p,today){if(p.publication_status==='published')return'Posted';if(p.scheduled_date<=today)return'Today';return'Upcoming'}
function postCard(p,cid){const posted=p.publication_status==='published',saved=p.saved;return `<article class="post" data-post="${esc(p.post_id)}"><img class="thumb" src="${esc(p.slide_urls[0])}" alt="First slide"><div><h3>${date(p.scheduled_date)} · ${esc(p.scheduled_time)}</h3><div class="meta">${esc(p.language.toUpperCase())}</div><p class="caption">${esc(p.caption)}</p><div class="badges"><span class="badge ${saved?'on':''}">${saved?'Saved':'Not saved'}</span><span class="badge ${posted?'on':''}">${posted?'Posted':'Not posted'}</span></div></div><div class="actions"><button onclick="showSlides('${esc(p.post_id)}')">Preview slides</button><a href="/api/campaigns/${encodeURIComponent(cid)}/posts/${encodeURIComponent(p.post_id)}/slides.zip">Download ZIP</a><button onclick="copyCaption('${esc(p.post_id)}')">Copy caption</button><button onclick="savePost('${esc(cid)}','${esc(p.post_id)}',${!saved})">${saved?'Mark unsaved':'Mark saved'}</button>${posted?'':`<button class="primary" onclick="postIt('${esc(cid)}','${esc(p.post_id)}')">Mark posted</button>`}</div></article>`}
async function campaign(cid){document.getElementById('back').hidden=false;const d=await json('/api/team/campaigns/'+encodeURIComponent(cid)),today=new Date().toISOString().slice(0,10),groups={Today:[],Upcoming:[],Posted:[]};currentPosts=new Map(d.posts.map(p=>[p.post_id,p]));d.posts.forEach(p=>groups[group(p,today)].push(p));app.innerHTML=`<h1 class="title">${esc(d.campaign.name)}</h1><p class="sub">${esc(d.campaign.account)}</p>`+Object.entries(groups).filter(([,v])=>v.length).map(([k,v])=>`<h2 class="section">${k}</h2><div class="grid">${v.map(p=>postCard(p,cid)).join('')}</div>`).join('')+(d.posts.length?'':'<div class="empty">No ready posts yet.</div>')}
function showSlides(pid){const urls=currentPosts.get(pid).slide_urls;document.getElementById('slides').innerHTML=urls.map((u,i)=>`<img src="${esc(u)}" alt="Slide ${i+1}">`).join('');preview.showModal()}
function copyCaption(pid){const text=currentPosts.get(pid).caption||'',button=document.activeElement;const field=document.createElement('textarea');field.value=text;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const legacyCopied=document.execCommand('copy');field.remove();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).catch(()=>{});if(!legacyCopied&&!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');if(button?.tagName==='BUTTON'){button.textContent='Copied';setTimeout(()=>{button.textContent='Copy caption'},1200)}}
async function savePost(cid,pid,saved){await json(`/api/campaigns/${encodeURIComponent(cid)}/posts/${encodeURIComponent(pid)}/mark-saved`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({saved})});await campaign(cid)}
async function postIt(cid,pid){if(!confirm('Mark this post as posted? This updates publication history.'))return;await json(`/api/team/campaigns/${encodeURIComponent(cid)}/posts/${encodeURIComponent(pid)}/mark-posted`,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});await campaign(cid)}
(async()=>{try{const m=location.pathname.match(/^\/team\/campaign\/([^/]+)$/);m?await campaign(decodeURIComponent(m[1])):await campaigns()}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div>`}})();
</script></body></html>
